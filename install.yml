---
- name: Configure machine with Terraform
  hosts: localhost
  tasks:        
    - name: Include Terraform Tasks
      ansible.builtin.import_tasks:
        file: tasks/terraform.yml
        
- name: Configure machine with gh-cli
  hosts: localhost
  tasks:        
    - name: Include gh-cli Tasks
      ansible.builtin.import_tasks:
        file: tasks/gh-cli.yml

- name: Configure machine with awscli
  hosts: localhost
  tasks:        
    - name: Include awscli Tasks
      ansible.builtin.import_tasks:
        file: tasks/awscli.yml
