---
# we only run when /usr/local/bin/aws does not exist
- name: check awscli installed
  ansible.builtin.stat: 
    path: /usr/local/bin/aws
  register: aws

- name: processing aws installation 
  block: 
    - name: install packages
      ansible.builtin.import_tasks:
        file: aws/packages.yml

    - name: register aws public key to verify download
      ansible.builtin.import_tasks:
        file: aws/publickey.yml
    
    - name: download the aws cli key and zip
      ansible.builtin.import_tasks:
        file: aws/download.yml
        
    - name: finally check the sig and install if zip is ok
      ansible.builtin.import_tasks:
        file: aws/install.yml
      
  when: aws.stat.exists == false
    
