# check the download signature
- name: check the signature
  ansible.builtin.shell:
    cmd: gpg --verify /tmp/awscli.zip.sig /tmp/awscli.zip
  register: signature

# install aws
- name: extract and install aws
  block: 
    - name: unzipping the awscli
      ansible.builtin.shell:
        cmd: unzip /tmp/awscli.zip -d /tmp
      
    - name: running the awscli installation
      ansible.builtin.shell:
        cmd: /tmp/aws/install
  when: '"Good signature" in signature.stderr'
