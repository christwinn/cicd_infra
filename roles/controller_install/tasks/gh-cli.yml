---
- name: check to see of repo already exists
  ansible.builtin.stat:
    path: /etc/yum.repos.d/gh-cli.repo
  register: ghcli

- name: add github repo
  ansible.builtin.shell:
    cmd: dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
  when: ghcli.stat.exists == false
  
- name: install gh cli
  ansible.builtin.dnf:
    name: gh
    state: latest
